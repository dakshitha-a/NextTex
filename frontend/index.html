<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The mark, on the app's own outermost ground because a tab strip is
         a ground nobody controls and a transparent page outline in --ink is
         invisible on half of them.  The same geometry as Logo.tsx, nine
         tenths the size so the tile has a margin; it used to be a different
         drawing here, a violet tile with a bare backslash and no page at
         all.  Generated by scripts/make-icons.py, which writes the desktop
         icon and docs/logo.svg from the same numbers, and inlined rather
         than fetched because it has to be right before any script runs. -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="NextTex"><rect width="32" height="32" rx="7" fill="%230A0C0B"/><rect x="7.9" y="4.3" width="16.2" height="23.4" rx="1.8" fill="none" stroke="%23E3E8E2" stroke-width="1.7"/><path d="M12.31 9.71 L19.69 22.29" fill="none" stroke="%23C988E7" stroke-width="2.7" stroke-linecap="round"/></svg>' />
    <meta name="theme-color" content="#0A0C0B" />
    <title>NextTex</title>
    <script>
      // Stamped before the stylesheet is applied, so the first frame is
      // already in the right theme.  It has to be a blocking classic
      // script: main.tsx is a module and therefore deferred, which is why
      // the flash existed at all.  Dark is the app's default, so a machine
      // set to prefer light is not consulted -- the previous approach
      // guessed from prefers-color-scheme and guessed wrong for exactly
      // the people the default was chosen for.
      try {
        var t = localStorage.getItem("nexttex.theme");
        var dark = t !== "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // The browser paints its own chrome with this, so it has to be the
        // app's outermost ground -- --surround -- and not, as it was, the
        // dark theme's --surface in both themes.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0A0C0B" : "#B9BEB8");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
