<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The mark's small cut.  Not the same drawing as Logo.tsx: at 16px on
         a strip of tabs the page outline closes up into a grey box with
         something in it, so this keeps only the part that carries the idea.
         Here rather than built from the component because it has to be
         right before any script runs. -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%237B45A0"/><path d="M11 8.5 L21 23.5" fill="none" stroke="%23fff" stroke-width="4.6" stroke-linecap="round"/></svg>' />
    <meta name="theme-color" content="#0A0C0B" />
    <title>NextTex</title>
    <script>
      // Stamped before the stylesheet is applied, so the first frame is
      // already in the right theme.  It has to be a blocking classic
      // script: main.tsx is a module and therefore deferred, which is why
      // the flash existed at all.  Dark is the app's default, so a machine
      // set to prefer light is not consulted -- the previous approach
      // guessed from prefers-color-scheme and guessed wrong for exactly
      // the people the default was chosen for.
      try {
        var t = localStorage.getItem("nexttex.theme");
        var dark = t !== "light";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // The browser paints its own chrome with this, so it has to be the
        // app's outermost ground -- --surround -- and not, as it was, the
        // dark theme's --surface in both themes.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0A0C0B" : "#B9BEB8");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
