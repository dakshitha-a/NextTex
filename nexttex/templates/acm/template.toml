title = "ACM paper"
kind = "conference"
order = 10
venue = "ACM conferences and journals"
summary = "Two columns for a proceedings paper, or one for an ACM journal."
class = "acmart"
source = "https://www.acm.org/publications/proceedings-template"
licence = "LPPL 1.3"

# Each TeX Live package the first build needs, with a file of its that
# says whether it is here.  `checked` is the version last compared with
# the package's source; scripts/check_templates.py compares them again.
[needs]
acmart = "acmart.cls"
xstring = "xstring.sty"
microtype = "microtype.sty"
totpages = "totpages.sty"
everyshi = "everyshi.sty"
environ = "environ.sty"
hyperxmp = "hyperxmp.sty"
ncctools = "manyfoot.sty"
cmap = "cmap.sty"
caption = "caption.sty"
comment = "comment.sty"
fancyhdr = "fancyhdr.sty"
preprint = "balance.sty"
# What a MiKTeX with only its basic set lacks beyond these, found one
# build at a time on the owner's laptop on 29 October 2026: amsart under
# acmart, hyperref's support packages, and the rest acmart loads.
amscls = "amsart.cls"
booktabs = "booktabs.sty"
refcount = "refcount.sty"
ltxcmds = "ltxcmds.sty"
infwarerr = "infwarerr.sty"
kvsetkeys = "kvsetkeys.sty"
kvdefinekeys = "kvdefinekeys.sty"
pdfescape = "pdfescape.sty"
hycolor = "hycolor.sty"
gettitlestring = "gettitlestring.sty"
kvoptions = "kvoptions.sty"
stringenc = "stringenc.sty"
intcalc = "intcalc.sty"
bitset = "bitset.sty"
bigintcalc = "bigintcalc.sty"
rerunfilecheck = "rerunfilecheck.sty"
uniquecounter = "uniquecounter.sty"
ifmtarg = "ifmtarg.sty"
geometry = "geometry.sty"
psnfss = "pifont.sty"
float = "float.sty"

[checked]
acmart = "2.20"
