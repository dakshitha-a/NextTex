title = "Elsevier article"
kind = "journal"
order = 21
venue = "Elsevier journals"
summary = "Elsevier's classic class, single-column for submission."
class = "elsarticle"
source = "https://www.elsevier.com/researcher/author/policies-and-guidelines/latex-instructions"
licence = "LPPL 1.3"

# Each TeX Live package the first build needs, with a file of its that
# says whether it is here.  `checked` is the version last compared with
# the package's source; scripts/check_templates.py compares them again.
[needs]
elsarticle = "elsarticle.cls"
grfext = "grfext.sty"
# What a MiKTeX with only its basic set lacks beyond these, from the
# owner's laptop on 29 October 2026: natbib under elsarticle, and the
# support packages grfext and the class load.
natbib = "natbib.sty"
infwarerr = "infwarerr.sty"
kvdefinekeys = "kvdefinekeys.sty"
ltxcmds = "ltxcmds.sty"
kvsetkeys = "kvsetkeys.sty"
kvoptions = "kvoptions.sty"

[checked]
elsarticle = "3.5"
