# Templates NextTex cannot ship, because their files carry no licence that
# lets anyone pass them on.  The browser lists each one with the way to get
# it from the people who publish it.  A guide has a title, a kind, the
# venue, the official page, and the steps, one sentence each.

[[guide]]
name = "neurips"
title = "NeurIPS"
kind = "conference"
venue = "Neural Information Processing Systems"
official = "https://neurips.cc/Conferences/2026/CallForPapers"
steps = [
  "Download this year's style files from the call for papers.",
  "Start from an article, and drop the .sty file into the project.",
  "Load it with \\usepackage{neurips_2026}, using the year's own name.",
]

[[guide]]
name = "icml"
title = "ICML"
kind = "conference"
venue = "International Conference on Machine Learning"
official = "https://icml.cc/Conferences/2026/AuthorInstructions"
steps = [
  "Download this year's style files from the author instructions.",
  "Start from an article, and drop the .sty and .bst files into the project.",
  "Load it with \\usepackage{icml2026}, using the year's own name.",
]

[[guide]]
name = "iclr"
title = "ICLR"
kind = "conference"
venue = "International Conference on Learning Representations"
official = "https://github.com/ICLR/Master-Template"
steps = [
  "Download the year's folder from the official template repository.",
  "Start from an article, and drop its .sty and .bst files into the project.",
  "Load it with \\usepackage{iclr2026_conference}, using the year's own name.",
]

[[guide]]
name = "acl"
