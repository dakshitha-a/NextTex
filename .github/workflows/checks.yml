# Type-check the interface and run its tests, on every push and every pull
# request.
#
# Neither had ever run anywhere but a laptop.  `scripts/check.sh` runs both,
# and the only other interface workflow builds the bundle -- but `vite build`
# strips types with esbuild and does not check them, so a type error reached
# master as a green build, and several hundred vitest cases ran only when somebody
# remembered to.  A component referenced exactly once, by its own definition,
# survived that way until an audit read the file.
#
# The two commands here are the two lines `scripts/check.sh` runs, written
# the same way on purpose: if they drift apart, the tier that people run by
# hand stops being the tier that guards the branch.
#
# Deliberately not a dependency of the release build in `frontend.yml`.  That
# workflow publishes the bundle every install fetches by commit sha, and
# `scripts/update.sh` cannot tell a missing asset from a failed build, so a
# type error here must fail this job and not remove an install's way forward.

name: interface checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # vitest needs the require(esm) support that arrived after 20.18,
          # which is why the floor is not simply 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Tests
        run: node_modules/.bin/vitest run
