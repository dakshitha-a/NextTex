# Install NextTex the way the README says to, on a machine that was clean
# five minutes ago, and check the README's claims one by one.
#
# Everything the `python` workflow does for the installer is a unit test:
# the survey takes its platform as an argument, the steps assert their
# command lines with the child processes replaced, and the bootstraps are
# parsed or driven through a pty on Linux.  None of it had ever cloned,
# made a .venv, fetched the interface, written a service file and started
# the server on a runner.  This does, on all three, and then does the two
# things the README claims that nothing tested: runs the install a second
# time and expects it to change nothing, and runs the uninstall section and
# expects nothing to be left.
#
# Scheduled and on demand, not on push.  A real install is minutes on each
# runner, and a macOS runner is a scarce thing; the per-push job stays the
# fast one.  Dispatch this after a push to see the commit under test, and
# narrow it with the inputs to the leg being worked on.
#
# One thing to know before dispatching by hand.  The `interface` workflow
# publishes the prebuilt bundle for a master commit a few minutes after the
# push, so a run dispatched straight away finds no asset for HEAD and the
# installer falls back to building the interface with the runner's Node.
# The native legs record which happened and accept both; the containers
# have no Node, so for those, let the interface build finish first.
#
# `tests/lane/verify_install.py` holds the assertions.  It runs on the bare
# interpreter the runner has, imports nothing outside the standard library,
# and is deliberately not collected by pytest: it needs a machine, not a
# mock.

name: install

on:
  schedule:
    # Monday, early, UTC.  Weekly rather than nightly: the repository changes
    # in bursts, and every dispatched run during a burst is the real check.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      os:
        description: which runners
        type: choice
        options: [all, ubuntu, macos, windows]
        default: all
      tex:
        description: install TinyTeX as well (slow, and a CTAN mirror away)
        type: choice
        options: [none, tinytex]
        default: none
      update:
        description: also install the previous commit and update to this one
        type: boolean
        default: true
      distros:
        description: also run the shell bootstrap in Debian, Alpine, Fedora and a box with no Python
        type: boolean
        default: true

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

env:
  # No prompt can be answered here, and both installers read this and take
  # the unattended defaults rather than waiting on one.
  CI: "1"

jobs:
  # ---------------------------------------------------------------------
  # The documented command, on the real thing.
  #
  # Two installs per runner, because the README documents two shapes.  The
  # first runs `scripts/install.sh` from inside the checkout, which installs
  # the commit under test, as a named instance so the second can have the
  # default name.  The second is the pipe: the checkout's script fed to
  # `sh -s`, exactly as `curl | sh` would feed it, cloning from GitHub into
  # `~/apps/NextTex`.  The pipe install is the one that is then run again
  # and uninstalled, because it is the one the README's uninstall section
  # names paths for.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.os == 'ubuntu' && fromJSON('["ubuntu-latest"]')) || (inputs.os == 'macos' && fromJSON('["macos-latest"]')) || (inputs.os == 'windows' && fromJSON('["windows-latest"]')) || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Kept outside the checkout, because the last thing this job does is
      # remove an install, and the verifier has to outlive that.
      - name: Keep the verifier somewhere safe
        shell: bash
        run: cp tests/lane/verify_install.py "$RUNNER_TEMP/verify_install.py"

      # -- Linux and macOS ---------------------------------------------------

      - name: Install the checkout (sh, from inside it)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/install.sh --yes --tex=${{ inputs.tex || 'none' }} --service --instance=checkout

      - name: Verify the checkout install
        if: runner.os != 'Windows'
        shell: bash
        run: python3 "$RUNNER_TEMP/verify_install.py" installed --root "$GITHUB_WORKSPACE" --instance checkout --head "$GITHUB_SHA" --service --shortcut

      - name: Install from the pipe (sh -s, cloning from GitHub)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: cat "$GITHUB_WORKSPACE/scripts/install.sh" | sh -s -- --yes --tex=none --service

      - name: Verify the pipe install
        if: runner.os != 'Windows'
        shell: bash
        run: python3 "$RUNNER_TEMP/verify_install.py" installed --root "$HOME/apps/NextTex" --service --shortcut --record "$RUNNER_TEMP/pipe.json"

      - name: Run the pipe install a second time
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: cat "$GITHUB_WORKSPACE/scripts/install.sh" | sh -s -- --yes --tex=none --service

      - name: Verify it changed nothing
        if: runner.os != 'Windows'
        shell: bash
        run: python3 "$RUNNER_TEMP/verify_install.py" again --root "$HOME/apps/NextTex" --service --record "$RUNNER_TEMP/pipe.json"

      - name: Uninstall, the README's way (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          systemctl --user disable --now nexttex
          rm ~/.config/systemd/user/nexttex.service
          systemctl --user daemon-reload
          rm -rf ~/apps/NextTex ~/.local/share/nexttex

      - name: Uninstall, the README's way (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          launchctl unload ~/Library/LaunchAgents/com.nexttex.server.plist
          rm ~/Library/LaunchAgents/com.nexttex.server.plist
          rm -rf ~/apps/NextTex ~/.local/share/nexttex

      - name: Verify nothing is left
        if: runner.os != 'Windows'
        shell: bash
        run: python3 "$RUNNER_TEMP/verify_install.py" gone --root "$HOME/apps/NextTex" --port 8450

      # -- Windows -----------------------------------------------------------
      #
      # Two shells on purpose.  `irm | iex` from the README runs in whatever
      # PowerShell the person opened, and on a stock Windows that is 5.1,
      # which the per-push lint never parses: it uses the PowerShell 7 parser
      # on Ubuntu.  So the pipe shape runs under `powershell` (5.1) and the
      # in-checkout shape under `pwsh` (7).

      - name: Install the checkout (pwsh 7, from inside it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts\install.ps1 -Yes -Tex none -Instance checkout
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify the checkout install
        if: runner.os == 'Windows'
        shell: pwsh
        run: python "$env:RUNNER_TEMP\verify_install.py" installed --root "$env:GITHUB_WORKSPACE" --instance checkout --head "$env:GITHUB_SHA" --shortcut

      - name: Install from the pipe (Windows PowerShell 5.1, iex, cloning from GitHub)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $PSVersionTable.PSVersion
          Get-Content -Raw "$env:GITHUB_WORKSPACE\scripts\install.ps1" | iex

      - name: Verify the pipe install
        if: runner.os == 'Windows'
        shell: powershell
        run: python "$env:RUNNER_TEMP\verify_install.py" installed --root "$HOME\apps\NextTex" --shortcut --record "$env:RUNNER_TEMP\pipe.json"

      - name: Run the pipe install a second time
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: Get-Content -Raw "$env:GITHUB_WORKSPACE\scripts\install.ps1" | iex

      - name: Verify it changed nothing
        if: runner.os == 'Windows'
        shell: powershell
        run: python "$env:RUNNER_TEMP\verify_install.py" again --root "$HOME\apps\NextTex" --record "$env:RUNNER_TEMP\pipe.json"

      - name: Uninstall, the README's way (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Unregister-ScheduledTask -TaskName NextTex -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item "$([Environment]::GetFolderPath('Startup'))\NextTex.lnk" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$HOME\apps\NextTex", "$HOME\.local\share\nexttex"

      - name: Verify nothing is left
        if: runner.os == 'Windows'
        shell: powershell
        run: python "$env:RUNNER_TEMP\verify_install.py" gone --root "$HOME\apps\NextTex" --port 8450

      # -- The browser tier's update spec, on the install just made ---------
      #
      # `e2e/specs/update.spec.ts` drives the in-app update footer against a
      # repository it builds itself, and is run by no other workflow.  It
      # wants `.venv` and `frontend/dist` at the checkout, which the first
      # install of this job has just put there.

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: The update spec in a browser
        if: runner.os == 'Linux'
        working-directory: e2e
        run: |
          # A downloaded interface carries the mtimes it was built with,
          # which are older than the checkout, and the tier's global setup
          # would then rebuild it here without frontend/node_modules.  It
          # is the right bundle for this commit; only its dates are old.
          find ../frontend/dist -type f -exec touch {} +
          npm ci
          npx playwright install --with-deps chromium
          export NEXTTEX_CHROME="$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)"
          echo "chromium at $NEXTTEX_CHROME"
          npx playwright test specs/update.spec.ts

      # -- Whatever happened, keep the logs ----------------------------------

      - name: Collect the logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          for d in ~/.local/share/nexttex*; do
            [ -d "$d" ] || continue
            for f in "$d"/*.log; do
              [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/logs/$(basename "$d")-$(basename "$f")"
            done
          done
          ls -la "$RUNNER_TEMP/logs" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # The update, from the previous commit to this one.
  #
  # A bare copy of the checkout stands in for GitHub, with its master set
  # back one commit.  The install is made from that, master is moved to
  # HEAD, and the update script is run by hand the way the README says.
  # The interface for a local remote cannot be downloaded, so this leg
  # always takes the Node fallback, which is the path a machine that cannot
  # reach GitHub takes.
  update:
    # `inputs` is empty on the schedule, and a loose comparison there says
    # the wrong thing, so the event is asked first.
    if: ${{ github.event_name == 'schedule' || inputs.update }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.os == 'ubuntu' && fromJSON('["ubuntu-latest"]')) || (inputs.os == 'macos' && fromJSON('["macos-latest"]')) || (inputs.os == 'windows' && fromJSON('["windows-latest"]')) || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: A remote one commit behind
        shell: bash
        run: |
          set -euo pipefail
          git clone --bare --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/remote.git"
          git -C "$RUNNER_TEMP/remote.git" symbolic-ref HEAD refs/heads/master
          git -C "$RUNNER_TEMP/remote.git" update-ref refs/heads/master "$(git rev-parse HEAD~1)"
          echo "previous $(git rev-parse --short HEAD~1), this $(git rev-parse --short HEAD)"

      - name: Install the previous commit (sh)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          NEXTTEX_REPO: ${{ runner.temp }}/remote.git
        run: cat "$GITHUB_WORKSPACE/scripts/install.sh" | sh -s -- --yes --tex=none

      - name: Install the previous commit (powershell)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}
        env:
          NEXTTEX_REPO: ${{ runner.temp }}\remote.git
        run: Get-Content -Raw "$env:GITHUB_WORKSPACE\scripts\install.ps1" | iex

      - name: Move the remote to this commit
        shell: bash
        run: git -C "$RUNNER_TEMP/remote.git" update-ref refs/heads/master "$GITHUB_SHA"

      - name: Update (update.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/apps/NextTex/scripts/update.sh" | tee "$RUNNER_TEMP/update.out"
          test "$(git -C "$HOME/apps/NextTex" rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q "continuing with the updated script" "$RUNNER_TEMP/update.out"
          log=~/.local/share/nexttex/update.log
          test -f "$log"
          test "$(grep -c '^=== ' "$log")" = 1
          "$HOME/apps/NextTex/.venv/bin/python" "$HOME/apps/NextTex/server/run.py" --version

      - name: Update (update.ps1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$HOME\apps\NextTex\scripts\update.ps1"
          if ($LASTEXITCODE) { throw "update.ps1 exited $LASTEXITCODE" }
          $head = (git -C "$HOME\apps\NextTex" rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "landed on $head, not $env:GITHUB_SHA" }
          $log = "$HOME\.local\share\nexttex\update.log"
          if (-not (Test-Path $log)) { throw "no update.log at $log" }
          & "$HOME\apps\NextTex\.venv\Scripts\python.exe" "$HOME\apps\NextTex\server\run.py" --version

      - name: Verify the updated install
        shell: bash
        run: python3 tests/lane/verify_install.py installed --root "$HOME/apps/NextTex" --head "$GITHUB_SHA"

      - name: Collect the logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp ~/.local/share/nexttex/*.log "$RUNNER_TEMP/logs/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/logs" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # The shell bootstrap on the Linuxes it will actually meet.
  #
  # Linux only, because containers are.  Each image is what a fresh box of
  # that distribution has once git and curl are on it, and no more: Debian
  # has a python3 that cannot make a venv, which is the case the uv step
  # exists for; Alpine's sh is busybox ash, a shell the pty tests never
  # see; Fedora is the RPM side; and the last has no Python at all, which is
  # the bootstrap's own download branch.  These clone from GitHub and have
  # no Node, so the interface for master's HEAD has to be published.
  distros:
    if: ${{ github.event_name == 'schedule' || (inputs.distros && (inputs.os == 'all' || inputs.os == 'ubuntu')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            setup: apt-get update -qq && apt-get install -y -qq git curl ca-certificates python3 >/dev/null
          - image: alpine:3.20
            setup: apk add -q git curl python3
          - image: fedora:40
            setup: dnf install -y -q git curl python3
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq git curl ca-certificates >/dev/null
    steps:
      - uses: actions/checkout@v4

      - name: Install inside ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -e CI=1 -e HOME=/root "${{ matrix.image }}" sh -c '
            set -e
            ${{ matrix.setup }}
            echo "--- python3: $(command -v python3 || echo none)"
            cat /src/scripts/install.sh | sh -s -- --yes --tex=none
            /root/apps/NextTex/.venv/bin/python /src/tests/lane/verify_install.py installed --root /root/apps/NextTex
            cat /root/.local/share/nexttex/install.log > /dev/null
          '
