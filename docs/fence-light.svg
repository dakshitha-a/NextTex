<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="326" viewBox="0 0 1040 326" role="img" aria-label="The three positions of the control under the agent's box. Ask before acting, the default, is a card for every command, every fetch and every write that leaves the project. Run the work without asking lets commands and edits run, and still asks about a write outside the project or to a file the build runs, and about anything that reaches the internet. Never ask about anything asks about nothing, and takes a second press to switch on.">
<title>The three positions of the fence</title>
<rect width="1040" height="326" rx="10" fill="#E3E7E2"/>
<text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="1.6" fill="#4E534D">THE THREE POSITIONS OF THE FENCE</text>
<rect x="24" y="60" width="320" height="214" rx="5" fill="#FFFFFF" stroke="#6F2998" stroke-width="1.5"/>
<text x="42" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#6F2998">Ask before acting</text>
<text x="42" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#6F2998">the default</text>
<text x="42" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">asks about every command,</text>
<text x="42" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">every fetch, and every write</text>
<text x="42" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">that leaves the project</text>
<text x="42" y="218" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">the only complete fence</text>
<rect x="360" y="60" width="320" height="214" rx="5" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="378" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#141715">Run the work without asking</text>
<text x="378" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4E534D">the one most people want</text>
<text x="378" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">commands and edits run silently,</text>
<text x="378" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">pipes, chains and redirects included</text>
<text x="378" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">still asks: a write outside the project</text>
<text x="378" y="218" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">or to a file the build runs; anything</text>
<text x="378" y="238" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">that reaches the internet</text>
<rect x="696" y="60" width="320" height="214" rx="5" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="714" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#141715">Never ask about anything</text>
<text x="714" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4E534D">a second press to switch on</text>
<text x="714" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">asks about nothing, including a</text>
<text x="714" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">write that leaves the project</text>
<text x="714" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">your project's own files help</text>
<text x="714" y="218" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">instruct the agent, and they came</text>
<text x="714" y="238" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#373B36">from templates, clones, co-authors</text>
<text x="24" y="306" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#373B36">Whichever position you are in, every automatic approval is marked as one in the transcript, and Auto beside the agent's name says which position is on.</text>
</svg>
