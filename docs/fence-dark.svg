<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="326" viewBox="0 0 1040 326" role="img" aria-label="The three positions of the control under the agent's box. Ask before acting, the default, is a card for every command, every fetch and every write that leaves the project. Run the work without asking lets commands and edits run, and still asks about a write outside the project or to a file the build runs, and about anything that reaches the internet. Never ask about anything asks about nothing, and takes a second press to switch on.">
<title>The three positions of the fence</title>
<rect width="1040" height="326" rx="10" fill="#121614"/>
<text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="1.6" fill="#909892">THE THREE POSITIONS OF THE FENCE</text>
<rect x="24" y="60" width="320" height="214" rx="5" fill="#1E2320" stroke="#C988E7" stroke-width="1.5"/>
<text x="42" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#C988E7">Ask before acting</text>
<text x="42" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#C988E7">the default</text>
<text x="42" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">asks about every command,</text>
<text x="42" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">every fetch, and every write</text>
<text x="42" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">that leaves the project</text>
<text x="42" y="218" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">the only complete fence</text>
<rect x="360" y="60" width="320" height="214" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="378" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Run the work without asking</text>
<text x="378" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">the one most people want</text>
<text x="378" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">commands and edits run silently,</text>
<text x="378" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">pipes, chains and redirects included</text>
<text x="378" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">still asks: a write outside the project</text>
<text x="378" y="218" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">or to a file the build runs; anything</text>
<text x="378" y="238" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">that reaches the internet</text>
<rect x="696" y="60" width="320" height="214" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="714" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Never ask about anything</text>
<text x="714" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">a second press to switch on</text>
<text x="714" y="138" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">asks about nothing, including a</text>
<text x="714" y="158" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">write that leaves the project</text>
<text x="714" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">your project's own files help</text>
<text x="714" y="218" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">instruct the agent, and they came</text>
<text x="714" y="238" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#B0B5B0">from templates, clones, co-authors</text>
<text x="24" y="306" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#B0B5B0">Whichever position you are in, every automatic approval is marked as one in the transcript, and Auto beside the agent's name says which position is on.</text>
</svg>
