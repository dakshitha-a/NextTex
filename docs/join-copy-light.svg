<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="376" viewBox="0 0 1040 376" role="img" aria-label="The shared project on the left, your folder on the right, and between them what accepting does to each file: the same as yours, nothing; new from the others, written; only here, goes to everybody; different, the shared copy wins and yours is kept in the file's history; deleted by the others, yours goes to the trash; a git clone's own edits, merged in. Nothing is written until you accept.">
<title>Joining into a folder you already have</title>
<rect width="1040" height="376" rx="10" fill="#E3E7E2"/>
<text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="1.6" fill="#4E534D">JOINING INTO A FOLDER YOU ALREADY HAVE</text>
<rect x="24" y="60" width="200" height="262" rx="5" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="42" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#141715">The shared project</text>
<text x="42" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4E534D">arrives first, into memory</text>
<rect x="816" y="60" width="200" height="262" rx="5" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="834" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#141715">Your folder</text>
<text x="834" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#4E534D">a git clone, a backup, a copy</text>
<text x="42" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">main.tex</text>
<text x="834" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">main.tex</text>
<line x1="236" y1="130" x2="804" y2="130" stroke="#B9BEB8" stroke-width="1.5"/>
<rect x="330" y="118" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="520" y="134" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle" fill="#373B36">same as yours: left as it is</text>
<text x="42" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">chapters/two.tex</text>
<text x="834" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">chapters/two.tex</text>
<line x1="236" y1="162" x2="804" y2="162" stroke="#B9BEB8" stroke-width="1.5"/>
<rect x="330" y="150" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="520" y="166" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle" fill="#373B36">new from the others: written</text>
<text x="42" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">notes.tex</text>
<text x="834" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">notes.tex</text>
<line x1="236" y1="194" x2="804" y2="194" stroke="#B9BEB8" stroke-width="1.5"/>
<rect x="330" y="182" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="1"/>
<text x="520" y="198" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle" fill="#373B36">only here: goes to everybody</text>
<text x="42" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">intro.tex</text>
<text x="834" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">intro.tex</text>
<line x1="236" y1="226" x2="804" y2="226" stroke="#6F2998" stroke-width="1.5"/>
<rect x="330" y="214" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#6F2998" stroke-width="1"/>
<text x="520" y="230" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle" fill="#6F2998">different: the shared copy wins; yours kept in its history</text>
<text x="42" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">old.tex</text>
<text x="834" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">old.tex</text>
<line x1="236" y1="258" x2="804" y2="258" stroke="#6F2998" stroke-width="1.5"/>
<rect x="330" y="246" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#6F2998" stroke-width="1"/>
<text x="520" y="262" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle" fill="#6F2998">deleted by the others: yours goes to the trash</text>
<text x="42" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">figure.py</text>
<text x="834" y="294" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#373B36">figure.py</text>
<line x1="236" y1="290" x2="804" y2="290" stroke="#6F2998" stroke-width="1.5"/>
<rect x="330" y="278" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#6F2998" stroke-width="1"/>
<text x="520" y="294" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle" fill="#6F2998">edited since your last commit: your edits merged in, by git</text>
<text x="24" y="356" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#373B36">The card shows this before anything is written. Where the two disagree the shared project wins, and what it replaces goes somewhere you can get it back from.</text>
</svg>
