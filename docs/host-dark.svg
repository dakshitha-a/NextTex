<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="An always-on host between writers who are never online together. You, online in the morning, and your co-author, online at night, each connect to one host in the middle, an ordinary NextTex on a machine that stays on. It keeps a copy of every shared project and passes edits along whenever either of you is online. Anyone else in the share connects to it the same way.">
<title>An always-on host</title>
<rect width="760" height="360" rx="10" fill="#232825"/>
<text x="20" y="32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#A9B2AB" letter-spacing="1.6">AN ALWAYS-ON HOST</text>
<rect x="16" y="64" width="210" height="104" rx="6" fill="#1E2320" stroke="#3A403C"/>
<text x="34" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#E3E8E2">You</text>
<text x="34" y="122" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#A9B2AB">online in the morning</text>
<text x="34" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#A9B2AB">your own NextTex</text>
<rect x="534" y="64" width="210" height="104" rx="6" fill="#1E2320" stroke="#3A403C"/>
<text x="552" y="96" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#E3E8E2">Your co-author</text>
<text x="552" y="122" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#A9B2AB">online at night</text>
<text x="552" y="146" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#A9B2AB">their own NextTex</text>
<rect x="296" y="56" width="168" height="168" rx="8" fill="#1E2320" stroke="#C988E7" stroke-width="2"/>
<rect x="318" y="78" width="124" height="22" rx="4" fill="#232825" stroke="#C3C8C3" stroke-width="1.2"/>
<line x1="330" y1="89" x2="380" y2="89" stroke="#3A403C" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="428" cy="89" r="4" fill="#C988E7"/>
<rect x="318" y="108" width="124" height="22" rx="4" fill="#232825" stroke="#C3C8C3" stroke-width="1.2"/>
<line x1="330" y1="119" x2="380" y2="119" stroke="#3A403C" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="428" cy="119" r="4" fill="#C988E7"/>
<text x="380" y="166" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#E3E8E2">Always-on host</text>
<text x="380" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" text-anchor="middle" fill="#A9B2AB">a spare machine</text>
<text x="380" y="210" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" text-anchor="middle" fill="#A9B2AB">or a lab node</text>
<line x1="235" y1="116" x2="287" y2="116" stroke="#C988E7" stroke-width="1.75"/>
<path d="M287 111 l7 5 -7 5z" fill="#C988E7"/>
<path d="M235 111 l-7 5 7 5z" fill="#C988E7"/>
<line x1="473" y1="116" x2="525" y2="116" stroke="#C988E7" stroke-width="1.75"/>
<path d="M525 111 l7 5 -7 5z" fill="#C988E7"/>
<path d="M473 111 l-7 5 7 5z" fill="#C988E7"/>
<text x="261" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" text-anchor="middle" fill="#A9B2AB">9 am</text>
<text x="499" y="104" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" text-anchor="middle" fill="#A9B2AB">11 pm</text>
<rect x="484" y="252" width="260" height="44" rx="6" fill="#1E2320" stroke="#3A403C" stroke-dasharray="5 4"/>
<text x="614" y="279" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#E3E8E2">Anyone else in the share</text>
<path d="M484 274 C460 274 452 250 444 228" fill="none" stroke="#3A403C" stroke-width="1.75" stroke-dasharray="4 4"/>
<text x="20" y="268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#C3C8C3">Edits cross whenever</text>
<text x="20" y="290" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#C3C8C3">either of you is online.</text>
<text x="20" y="324" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#A9B2AB">No accounts. The host builds no PDFs for projects nobody opens there.</text>
</svg>
