<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Two NextTex installs, each holding a whole copy of the project, connected directly and encrypted to the other's public key. A relay forwards ciphertext only when a direct route cannot be made. There is no server in the middle and no accounts.">
<title>Writing it with somebody else</title>
<rect width="1040" height="330" rx="10" fill="#121614"/>
<text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="1.6" fill="#909892">WRITING IT WITH SOMEBODY ELSE</text>
<rect x="400" y="56" width="240" height="54" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1" stroke-dasharray="5 4"/>
<text x="416" y="80" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#B0B5B0">A relay, only if needed</text>
<text x="416" y="98" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">forwards ciphertext, sees nothing</text>
<line x1="300" y1="176" x2="440" y2="110" stroke="#3A403C" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="740" y1="176" x2="600" y2="110" stroke="#3A403C" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="24" y="176" width="380" height="118" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="42" y="204" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Your NextTex</text>
<text x="42" y="228" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">every file, and what they used to say</text>
<text x="42" y="248" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">its own history, its own trash</text>
<text x="42" y="268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">its own .git, its own backups</text>
<rect x="636" y="176" width="380" height="118" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="654" y="204" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Their NextTex</text>
<text x="654" y="228" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">every file, and what they used to say</text>
<text x="654" y="248" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">its own history, its own trash</text>
<text x="654" y="268" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#909892">its own .git, its own backups</text>
<line x1="414" y1="235" x2="626" y2="235" stroke="#C988E7" stroke-width="1.5"/>
<path d="M625 231 l6 4 -6 4z" fill="#C988E7"/>
<path d="M415 231 l-6 4 6 4z" fill="#C988E7"/>
<text x="520" y="224" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#C988E7">encrypted, direct</text>
<text x="520" y="254" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#909892">to their key, not an address</text>
<text x="24" y="318" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#B0B5B0">No accounts and nothing in the middle. Both of you can write with the other machine shut, and the two sets of edits are merged when it wakes.</text>
</svg>
