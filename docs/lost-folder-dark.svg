<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="316" viewBox="0 0 1040 316" role="img" aria-label="Three panels. Your folder is deleted, moved or on a drive that went away, and your NextTex closes the project and says so. Their copy is untouched: every file, its history, its trash. Your project list offers two ways back, Find it for a folder that moved and Rejoin from collaborators for one that is gone, with no new invite.">
<title>Losing your folder is not losing your place</title>
<rect width="1040" height="316" rx="10" fill="#232825"/>
<text x="24" y="34" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="1.6" fill="#A2ABA4">LOSING YOUR FOLDER IS NOT LOSING YOUR PLACE</text>
<rect x="24" y="60" width="286" height="200" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="42" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Your folder goes</text>
<text x="42" y="110" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#A2ABA4">deleted, moved, or on a sleeping drive</text>
<rect x="42" y="128" width="250" height="54" rx="5" fill="#232825" stroke="#3A403C" stroke-width="1" stroke-dasharray="5 4"/>
<text x="58" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#BDC2BD">~/papers/thesis</text>
<text x="58" y="170" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#A2ABA4">gone from this disk</text>
<text x="42" y="208" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">Your NextTex closes the project and says so.</text>
<text x="42" y="226" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">Nothing is flagged, written or sent.</text>
<text x="42" y="244" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">Your place in the share is not in the folder.</text>
<line x1="322" y1="160" x2="366" y2="160" stroke="#3A403C" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="344" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" fill="#A2ABA4">nothing</text>
<text x="344" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" fill="#A2ABA4">travels</text>
<rect x="378" y="60" width="286" height="200" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="396" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Their copy</text>
<text x="396" y="110" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#A2ABA4">untouched</text>
<text x="396" y="140" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">every file, as it was</text>
<text x="396" y="162" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">every version, every trash entry</text>
<text x="396" y="184" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">their own git, their own backups</text>
<text x="396" y="206" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#BDC2BD">still connected to everyone else</text>
<path d="M396 226 l4 4 8 -8" fill="none" stroke="#C988E7" stroke-width="1.5"/>
<text x="414" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#C988E7">nothing to recover</text>
<line x1="676" y1="160" x2="724" y2="160" stroke="#C988E7" stroke-width="1.5"/><path d="M723 156 l6 4 -6 4z" fill="#C988E7"/>
<text x="700" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle" fill="#A2ABA4">they send it</text>
<rect x="734" y="60" width="282" height="200" rx="5" fill="#1E2320" stroke="#3A403C" stroke-width="1"/>
<text x="752" y="88" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600" fill="#E3E8E2">Two ways back</text>
<text x="752" y="110" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#A2ABA4">on your project list</text>
<rect x="752" y="128" width="246" height="46" rx="5" fill="#2A2131" stroke="#C988E7" stroke-width="1"/>
<text x="766" y="148" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#C988E7">Find it…</text>
<text x="766" y="165" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#A2ABA4">if you moved it: reconnects as it is</text>
<rect x="752" y="186" width="246" height="58" rx="5" fill="#2A2131" stroke="#C988E7" stroke-width="1"/>
<text x="766" y="206" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" fill="#C988E7">Rejoin from collaborators…</text>
<text x="766" y="223" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#A2ABA4">if it is gone: they send it again,</text>
<text x="766" y="237" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#A2ABA4">no new invite needed</text>
<text x="24" y="296" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#BDC2BD">The note of which share you are in lives with your NextTex, not in the folder. Losing the folder is losing one copy, and the others still have theirs.</text>
</svg>
